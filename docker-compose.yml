volumes:
  db_data:

x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  prepare-data:
    image: open-meteo-geocoding-data-init:latest
    build:
      context: .
      target: data-init
    volumes:
      - db_data:/app/data
    environment:
      GEONAMES_DUMP_URL: ${GEONAMES_DUMP_URL:-https://download.geonames.org/export/dump}
    restart: "no"

  open-meteo:
    image: open-meteo:latest
    build:
      context: .
      target: runtime
    depends_on:
      prepare-data:
        condition: service_completed_successfully
    volumes:
      - db_data:/app/data
    environment:
      <<: *shared_environment
    ports:
      - '8080:8080'
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
